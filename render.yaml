# Render Blueprint: one Docker web service + one managed Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: genhealth-order-intake
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: genhealth-order-intake-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false # entered manually in the Render dashboard; never committed

databases:
  - name: genhealth-order-intake-db
    plan: free
